<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusOS | Teacher Dashboard</title>
    <link rel="stylesheet" href="teacher-dashboard.css">
</head>
<body>

<header class="header">
    <h2>CampusOS</h2>
    <button id="logoutBtn">Logout</button>
</header>

<main class="container">

    <h1>Teacher Dashboard</h1>
    <p>Welcome to your CampusOS teacher portal.</p>

    <section class="profile">
        <h2>Teacher Information</h2>
        <p>Name: <span id="teacherName">Loading...</span></p>
        <p>Email: <span id="teacherEmail">Loading...</span></p>
        <p>Role: <span id="teacherRole">Loading...</span></p>
        <p id="status">Connecting...</p>
    </section>

    <section class="session-section">

        <h2>Create Attendance Session</h2>

        <form id="sessionForm">

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                placeholder="Enter subject name"
                required
            >

            <label for="classType">Class Type</label>
            <select id="classType" required>
                <option value="">Select class type</option>
                <option value="Lecture">Lecture</option>
                <option value="Lab">Lab</option>
            </select>

            <label for="classroom">Classroom / Lab</label>
            <input
                type="text"
                id="classroom"
                placeholder="Example: Room 101"
                required
            >

            <button type="submit" id="createBtn">
                Create Attendance Session
            </button>

        </form>

        <p id="sessionMessage"></p>

    </section>

    <section class="sessions-section">

        <h2>My Attendance Sessions</h2>

        <button id="refreshBtn">Refresh Sessions</button>

        <div id="sessionsList">
            Loading sessions...
        </div>

    </section>

</main>

<script src="teacher-dashboard.js"></script>

</body>
</html>

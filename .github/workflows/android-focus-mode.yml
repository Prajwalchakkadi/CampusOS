name: Build CampusOS Focus Mode APK

on:
  push:
    branches: [master]
    paths:
      - "android-focus-mode/**"
      - ".github/workflows/android-focus-mode.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CampusOS
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle :app:assembleDebug
        working-directory: android-focus-mode
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusOS-Focus-Mode-debug
          path: android-focus-mode/app/build/outputs/apk/debug/app-debug.apk
